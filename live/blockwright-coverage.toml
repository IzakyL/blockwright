[neoforge]
minecraft_version = "1.21.1"
loader_version = "21.1.233"
jvm_args = ["-Xmx2G"]

[neoforge.java]
runtime = "java"

[neoforge.server]
eula = true
world = "flat"
properties = { "online-mode" = "false", "level-seed" = "blockwright-live", "allow-flight" = "true" }

[neoforge.client]
connect = "127.0.0.1:25565"
options = { guiScale = "1", fullscreen = "false", maxFps = "260" }

[neoforge.client.display]
device = "auto"

# LDLib2 for NeoForge 1.21.1 (Modrinth "ldlib", 2.2.41), on both sides: it registers network payloads.
[mods.ldlib2]
url = "https://cdn.modrinth.com/data/B1CBVXHX/versions/RIgL4A7W/ldlib2-neoforge-1.21.1-2.2.41-all.jar"
sha512 = "4a1e76aa7e90f43f866a6cacc3a1ce0a4bf070517090234c9a56a9d431dc023a06fcbaeb15b83c9957e0387271670e581a58b799cfe5beac0a51f42442795925"

# Measures LDLib2 itself: its own classes and the code its mixins put into Minecraft's.
[coverage]
enabled = true
mods = ["ldlib2"]
dir = ".blockwright/coverage-live"
