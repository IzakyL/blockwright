[neoforge]
minecraft_version = "1.21.1"
loader_version = "21.1.233"
jvm_args = ["-Xmx2G"]

[neoforge.java]
runtime = "java"

[neoforge.server]
eula = true
world = "flat"
properties = { "online-mode" = "false", "level-seed" = "blockwright-live", "allow-flight" = "true" }

[neoforge.client]
connect = "127.0.0.1:25565"
options = { guiScale = "1", fullscreen = "false" }
