[neoforge]
minecraft_version = "1.21.1"
loader_version = "21.1.233"
jvm_args = ["-Xmx2G"]

[neoforge.java]
runtime = "java"

[neoforge.server]
eula = true
world = "flat"
properties = { "online-mode" = "false", "level-seed" = "blockwright-windows", "allow-flight" = "true" }

[neoforge.client]
options = { guiScale = "1", fullscreen = "false", maxFps = "60" }

[neoforge.client.display]
device = "gpu"
width = 640
height = 360
