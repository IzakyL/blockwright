name: Live game smoke
on:
  workflow_dispatch:
    inputs:
      accept_minecraft_eula:
        description: 'I have read and accept https://www.minecraft.net/eula for this test run'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  live:
    if: inputs.accept_minecraft_eula
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libegl1 libgl1 libgl1-mesa-dri libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libasound2t64 ffmpeg
      - run: rustup show
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run build:native
      - run: npm run build:agents
      - run: npm run build:dev
      - name: Qualify Linux rendering, software EGL, cleanup, coverage and fixtures
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/linux-report.json
        run: npm run test:live -- coverage.spec.ts lifecycle.spec.ts offscreen.spec.ts test-fixtures.spec.ts --workers=1 --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-game-test-results
          path: test-results/
          if-no-files-found: ignore
